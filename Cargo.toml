[workspace]
resolver = "3"
members = [
    "crates/parterre-util",
    "crates/parterre-core",
    "crates/parterre-forge",
    "crates/parterre-highlight",
    "crates/parterre",
]

[workspace.package]
# Not parterre's version, which comes from the git tags (docs/releasing.md). 0.0.0 so that it
# can't pass for one; scripts/prepare-crates-release.py sets the tag's version for crates.io.
version = "0.0.0"
edition = "2024"
# egui/eframe 0.36 need 1.95.
rust-version = "1.95"
authors = ["Mattias Åslund <mattias@trustfall.se>"]
license = "GPL-3.0-only"
# Only to crates.io, which packaging/about.toml relies on to leave our own crates out of the
# third-party notices.
publish = ["crates-io"]
repository = "https://github.com/aquamoth/parterre"
homepage = "https://github.com/aquamoth/parterre"

[workspace.dependencies]
# crates.io needs a version next to the path; keep it equal to the workspace version above.
parterre-util = { path = "crates/parterre-util", version = "=0.0.0" }
parterre-core = { path = "crates/parterre-core", version = "=0.0.0" }
parterre-forge = { path = "crates/parterre-forge", version = "=0.0.0" }
# Without its default `syntax`, which the app turns on through its own feature.
parterre-highlight = { path = "crates/parterre-highlight", version = "=0.0.0", default-features = false }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
# Native folder picker: Windows' own dialog, macOS's NSOpenPanel, and on Linux the XDG desktop
# portal (falling back to zenity), so no GTK is linked.
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
tempfile = "3"
# HTTPS for GitHub's API (open pull requests), behind parterre-forge's `github` feature: rustls
# with ring, checking certificates against the operating system's trust store (so it works
# behind proxies that inspect TLS with their own certificate authority), and no system TLS
# library. Not ureq's default `rustls` feature, which bundles Mozilla's roots (webpki-roots,
# CDLA-Permissive-2.0, a licence packaging/about.toml doesn't accept); `_ring` is how ureq
# picks ring without them. About 20 crates and 2 MB.
ureq = { version = "3.4", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
] }
serde_json = "1"

[workspace.lints.rust]
# "deny", not "forbid", so the one Windows console call in crates/parterre/src/console.rs can
# opt out locally.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep dev builds snappy at runtime: optimise dependencies (egui is slow unoptimised)
# while leaving our own crates quick to compile and debuggable. Dependencies get line tables
# only: backtraces and stepping keep working, their optimised locals showed as <optimized out>
# anyway, and a debug build shrinks by a fifth. Set `debug = true` on one package to look
# inside it.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The layout is heavy numeric code; optimise it even in dev and test builds (debug assertions
# and overflow checks stay on) so the property tests and the debug app stay fast.
[profile.dev.package.parterre-core]
opt-level = 2
