# cargo-about configuration for THIRD-PARTY-NOTICES.html, which ships next to the release
# binaries (see .github/workflows/ci.yml and release.yml). Generate it locally with
#   cargo about generate -c packaging/about.toml packaging/about.hbs -o THIRD-PARTY-NOTICES.html

# Licenses the dependencies may use, all compatible with GPL-3.0. Where a crate offers a choice,
# the first one listed here is taken.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    # Fonts embedded by egui.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# The targets releases are built for (.github/workflows/release.yml); add any new one here.
# Without the list, crates only other targets use would be listed too, and their licences
# checked: rustls-platform-verifier needs webpki-root-certs (CDLA-Permissive-2.0) on wasm32.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Our own crates are covered by LICENSE and NOTICE. cargo-about skips workspace crates that
# may only be published to the registries listed here, and ours say `publish = ["crates-io"]`.
private = { ignore = true, registries = ["crates-io"] }
ignore-dev-dependencies = true
ignore-build-dependencies = true
