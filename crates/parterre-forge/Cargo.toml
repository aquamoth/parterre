[package]
name = "parterre-forge"
description = "Internal to parterre: open pull requests from GitHub and Azure DevOps, shown on their head commits, and the user's repositories to clone. No stability promises."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
# GitHub's API over HTTPS. Without it, loading pull requests and repositories fails.
github = ["dep:ureq"]
# Azure DevOps' API over HTTPS. Without it, loading its pull requests and repositories fails.
azure-devops = ["dep:ureq"]

[dependencies]
parterre-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
