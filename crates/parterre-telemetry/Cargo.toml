[package]
name = "parterre-telemetry"
description = "Internal to parterre: what it asks and sends over the network, the update check, the usage statistics and the crash reports. No stability promises."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
# The update check (#258) and the download of Update now (#431), usage statistics (#261) and
# crash reports (#263). Without it the crate asks and sends nothing: the switch for packagers.
send = [
    "dep:serde",
    "dep:serde_json",
    "dep:ureq",
    "dep:sha2",
    "dep:posthog-rs",
    "dep:sys-locale",
    "dep:iana-time-zone",
]

[dependencies]
# v4 for the install ID, v7 for the session ID (#262).
uuid = { version = "1", features = ["v4", "v7"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
# To check an update's download against its release's SHA256SUMS (#431).
sha2 = { version = "0.11", default-features = false, optional = true }
# PostHog's official SDK, its blocking client: no async runtime of parterre's own. It brings
# reqwest, beside ureq (#225).
posthog-rs = { version = "0.27", default-features = false, features = [
    "error-tracking",
], optional = true }
# `$locale` and `$timezone`, as PostHog's mobile SDKs send them.
sys-locale = { version = "0.3", optional = true }
iana-time-zone = { version = "0.1", optional = true }

[lints]
workspace = true
