[package]
name = "parterre-core"
description = "Internal to parterre: repository loading, revision-graph construction and layout. No stability promises."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
# Open pull requests from GitHub's API (`forge::github`): the HTTPS client. Without it, loading
# them fails.
github = ["dep:ureq"]

[dependencies]
# Line and word diffs for file diffs (histogram, git's indent heuristic); chosen in #44.
imara-diff = { version = "0.2", default-features = false }
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
ureq = { workspace = true, optional = true }

# Finding Git for Windows when git.exe isn't on PATH (see src/git/program.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
