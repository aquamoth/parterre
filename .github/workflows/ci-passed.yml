name: CI passed

# Waits for the CI run of a commit on main and fails unless it passed. A build published from
# that commit doesn't run the tests again: CI has tested it on all three systems, Linux in the
# same Ubuntu 22.04 container the release binary is built in (#236). Called by canary.yml,
# nightly.yml and release.yml.
on:
  workflow_call:
    inputs:
      sha: { type: string, required: true }

permissions:
  actions: read

jobs:
  ci:
    name: CI passed
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          # An hour at most; CI takes about 15 minutes. A tag pushed right after its commit may
          # be seen before its CI run is.
          for attempt in $(seq 120); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then
              if [ "$attempt" -ge 10 ]; then
                echo "::error::No CI run on main for $SHA. Publish a commit on main (docs/releasing.md)."
                exit 1
              fi
              echo "No CI run for $SHA yet"
            else
              read -r status conclusion url <<< "$run"
              echo "$url: $status $conclusion"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && exit 0
                echo "::error::CI did not pass on $SHA: $url"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::CI did not finish on $SHA within an hour"
          exit 1
