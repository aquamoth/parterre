name: CI

# PRs are tested on their merge result, and main's ruleset requires them to be up to date with main
# before merging. Pushes to main still run: that seeds the Rust cache PR runs restore from (a PR run
# can read caches saved on main, never another PR's), so new PRs don't start from a cold build.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the older run of that PR that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the PR changes anything but Markdown. Pushes to main always build.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # When the file list can't be had, build.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          then
            echo code=true >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qv '\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown changed:"; printf '%s\n' "$files"
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # main's ruleset requires the three Test checks, so a Markdown-only PR still runs this job, but on
  # a Linux runner without the container and with every step skipped. (Skipping the whole job would
  # not do: a skipped matrix job reports as "Test (${{ matrix.os }})", which is not a required check.)
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Linux runs in Ubuntu 22.04, like the release build (see release.yml).
          - { os: ubuntu-latest, container: "ubuntu:22.04" }
    runs-on: ${{ needs.changes.outputs.code == 'true' && matrix.os || 'ubuntu-latest' }}
    container: ${{ needs.changes.outputs.code == 'true' && matrix.container || '' }}
    env:
      BUILD: ${{ needs.changes.outputs.code }}
    steps:
      - name: Prepare container
        if: env.BUILD == 'true' && matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@v6
        if: env.BUILD == 'true'
        # The whole history with its tags: the version follows the nearest release tag.
        with:
          fetch-depth: 0
      - name: Trust the checkout
        if: env.BUILD == 'true' && matrix.container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        if: env.BUILD == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: env.BUILD == 'true'
      - name: Format
        if: env.BUILD == 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: env.BUILD == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Each crate on its own, and without the features the app turns on: the workspace build
      # unifies features and would hide a crate that can't build by itself (#214).
      - name: Check crates alone
        if: env.BUILD == 'true'
        run: |
          cargo check -p parterre-util -p parterre-core -p parterre-forge -p parterre-highlight
          cargo check -p parterre-highlight --no-default-features
          cargo check -p parterre --no-default-features
      - name: Test
        if: env.BUILD == 'true'
        run: cargo test --workspace --no-fail-fast
      # Again with Git for Windows' line endings, which only its system config sets: parterre's
      # git sees them and the test helpers don't (#182). Fails here, before Windows does.
      - name: Test with core.autocrlf
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: GIT_CONFIG_SYSTEM="$GITHUB_WORKSPACE/.github/autocrlf.gitconfig" cargo test --workspace --no-fail-fast
      # Again with the Git 3.0 preview: git built with its breaking changes, which refuses bare
      # repositories it isn't told about and makes new ones reftable (#228). Built once, cached
      # (#166).
      - uses: actions/cache@v6
        if: env.BUILD == 'true' && matrix.container
        id: git3
        with:
          path: /opt/git3
          key: git-2.56.0-breaking-ubuntu22.04-v1
      - name: Build the Git 3.0 preview
        if: env.BUILD == 'true' && matrix.container && steps.git3.outputs.cache-hit != 'true'
        run: |
          apt-get install -y --no-install-recommends zlib1g-dev xz-utils
          curl -fsSLO https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz
          echo "26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3  git-2.56.0.tar.xz" | sha256sum -c
          tar xJf git-2.56.0.tar.xz
          make -C git-2.56.0 -j"$(nproc)" prefix=/opt/git3 WITH_BREAKING_CHANGES=YesPlease \
            NO_OPENSSL=1 NO_CURL=1 NO_EXPAT=1 NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 \
            NO_RUST=1 INSTALL_STRIP=-s install
          rm -rf git-2.56.0 git-2.56.0.tar.xz
      - name: Test with the Git 3.0 preview
        if: env.BUILD == 'true' && matrix.container
        run: |
          PATH="/opt/git3/bin:$PATH" git --version
          PATH="/opt/git3/bin:$PATH" cargo test --workspace --no-fail-fast
      - name: Build release
        if: env.BUILD == 'true'
        run: cargo build --release
      - uses: taiki-e/install-action@v2
        if: env.BUILD == 'true'
        with:
          tool: ${{ runner.os == 'Linux' && 'cargo-about,cargo-deb,cargo-generate-rpm' || 'cargo-about' }}
      # The binary with its license, NOTICE and the licenses of the crates built into it.
      - name: Package
        if: env.BUILD == 'true'
        shell: bash
        run: |
          mkdir dist
          cp target/release/parterre${{ runner.os == 'Windows' && '.exe' || '' }} LICENSE NOTICE dist/
          cargo about generate --locked -c packaging/about.toml packaging/about.hbs \
            -o dist/THIRD-PARTY-NOTICES.html
      # The .deb and .rpm from the same binary, so every PR has them to try
      # (packaging/linux/build-packages.sh). The linux-packages job installs them.
      - name: Linux packages
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: packaging/linux/build-packages.sh dist
      # The installer from the same files, so every PR has one to try
      # (packaging/windows/build-msi.ps1).
      - name: Windows installer
        if: env.BUILD == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 7.0.0
          PATH="$USERPROFILE/.dotnet/tools:$PATH" \
            pwsh packaging/windows/build-msi.ps1 -Stage dist -Out dist/parterre.msi
      - uses: actions/upload-artifact@v7
        if: env.BUILD == 'true'
        with:
          name: parterre-${{ matrix.os }}
          path: dist/

  # Installs the Linux leg's .deb and .rpm on Debian, Ubuntu, Fedora and openSUSE.
  linux-packages:
    name: Linux packages
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/linux-packages.yml
    with:
      artifact: parterre-ubuntu-latest
