name: Release

# The maintainer's tag vX.Y-rcN publishes a release candidate, and vX.Y a release, of the commit
# it is on (#397, #415). The version is counted for that commit, 1.2.3-rc or 1.2.3
# (parterre-stamp), and the release hangs on a tag the pipeline makes for it, v1.2.3-rc or
# v1.2.3. It reuses the commit's canary binaries (canary.yml), or builds them when there are
# none, writes the version into them, packages them, installs the packages on Linux, Windows and
# macOS, and publishes nothing unless that passes and CI passed on the commit. A release then
# goes to crates.io and Chocolatey too. See docs/releasing.md.
#
# Started by hand on a branch (gh workflow run release.yml --ref BRANCH), it builds, packages
# and installs an rc of the branch's commit the same way, but publishes nothing, leaving the
# packages as artifacts (#246).
on:
  push:
    tags: ["v[0-9]+.[0-9]+", "v[0-9]+.[0-9]+-rc[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ring: ${{ steps.plan.outputs.ring }}
      tag: ${{ steps.plan.outputs.tag }}
      run-id: ${{ steps.plan.outputs.run-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ring=rc
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case $GITHUB_REF_NAME in *-rc*) ;; *) ring=stable ;; esac
          fi
          version=$(cargo run -q --locked -p parterre-stamp -- version --ring "$ring")
          tag=v${version%%+*}
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The tag names the minor; the commit must be in it. A vX.Y tag on a commit that
            # already has a later minor's tags in its history would publish that minor.
            minor=${GITHUB_REF_NAME#v}
            minor=${minor%%-*}
            case $version in
            "$minor".*) ;;
            *)
              echo "::error::$GITHUB_REF_NAME is on a commit of $version: tag a commit of $minor"
              exit 1
              ;;
            esac
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$tag is published already: this commit has its $ring build"
              exit 1
            fi
          fi
          run=$(.github/scripts/canary-run.sh "$GITHUB_SHA")
          from=${run:+the binaries of canary run $run}
          echo "$version ($tag), ${from:-binaries built here}"
          {
            echo "version=$version"
            echo "ring=$ring"
            echo "tag=$tag"
            echo "run-id=$run"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.run-id == ''
    uses: ./.github/workflows/build.yml
    secrets: inherit

  package:
    name: Package
    needs: [plan, build]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.plan.outputs.version }}
      run-id: ${{ needs.plan.outputs.run-id || github.run_id }}

  install:
    name: Install
    needs: package
    if: ${{ !cancelled() && !failure() && needs.package.result == 'success' }}
    uses: ./.github/workflows/install.yml

  # The tag is on a commit of main, which CI has tested on all three systems. Instead of testing
  # it again, wait for that run and publish only if it passed (#236).
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci-passed.yml
    permissions:
      actions: read
    with:
      sha: ${{ github.sha }}

  publish:
    name: Publish
    needs: [plan, install, ci]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && needs.install.result == 'success' }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.plan.outputs.version }}
      ring: ${{ needs.plan.outputs.ring }}
      sha: ${{ github.sha }}

  # The Chocolatey package, from the MSI just published. Release candidates are built but not
  # pushed.
  chocolatey:
    name: Chocolatey
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/chocolatey.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      push: ${{ needs.plan.outputs.ring == 'stable' }}
    secrets: inherit

  # The crates, at the release's version, from the same commit; not for release candidates
  # (docs/releasing.md#cratesio). Trusted Publishing: crates.io trusts this workflow in the
  # crates-io environment and hands out a token for this run only. It can't create a crate, so
  # a new one is published by hand first. A crate already at this version is skipped, so
  # rerunning the job publishes the rest. Crates with `publish = false` (parterre-stamp) are
  # left out.
  crates:
    name: crates.io
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.ring == 'stable' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The release's tag, which the publish job made on this commit.
      - name: Fetch the tag
        run: git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
      # A checkout of the tag with the versions written into Cargo.toml and Cargo.lock.
      - name: Prepare
        run: python3 scripts/prepare-crates-release.py "$TAG" --output "$RUNNER_TEMP/crates"
      - name: Already published
        id: published
        working-directory: ${{ runner.temp }}/crates
        run: |
          version=${TAG#v}
          exists() {
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "parterre release ($GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$1")
            case $status in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::crates.io answered $status for $1"; exit 1 ;;
            esac
          }
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          exclude= todo= new=
          for crate in $(echo "$metadata" | jq -r '.packages[] | select(.publish == []) | .name'); do
            exclude="$exclude --exclude $crate"
          done
          for crate in $(echo "$metadata" | jq -r '.packages[] | select(.publish != []) | .name'); do
            if exists "$crate/$version"; then
              echo "$crate $version is published"
              exclude="$exclude --exclude $crate"
            elif exists "$crate"; then
              todo=true
            else
              new="$new $crate"
            fi
          done
          if [ -n "$new" ]; then
            echo "::error::New on crates.io:$new. Publish $version by hand, add the trusted publisher and rerun this job (docs/releasing.md#cratesio)."
            exit 1
          fi
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.published.outputs.todo
        id: auth
      - name: Publish
        if: steps.published.outputs.todo
        working-directory: ${{ runner.temp }}/crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace ${{ steps.published.outputs.exclude }}
