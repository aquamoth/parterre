name: Release

# Pushing a tag vX.Y.Z[-prerelease] publishes a GitHub Release with binaries for Linux,
# Windows and macOS. PARTERRE_RELEASE_TAG supplies the binary's version; build.rs checks that
# the tag points at the clean commit being built. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # In Ubuntu 22.04, so the binary needs only glibc 2.35 and runs on Debian 12, Ubuntu
          # 22.04 and newer (docs/distribution.md). The Rust toolchain still comes from rustup.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, container: "ubuntu:22.04" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-compiled on the Apple silicon runner, so the binary can't run there: no tests
          # and no --version check. build.rs still checks the tag and sets the version.
          - { os: macos-latest, target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      PARTERRE_RELEASE_TAG: ${{ github.ref_name }}
    # No rust-cache: caches saved by a tag run are never restored by later runs, and a release
    # should come from a clean build anyway.
    steps:
      # Before checkout: without git it downloads the sources without .git, and build.rs needs
      # the commit.
      - name: Prepare container
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@v6
      # The checkout belongs to the runner's user and the container runs as root; git ignores
      # such repositories unless they are marked safe.
      - name: Trust the checkout
        if: matrix.container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check version
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          expected="parterre ${GITHUB_REF_NAME#v} ($(git rev-parse --short=7 HEAD))"
          actual=$(target/${{ matrix.target }}/release/parterre --version)
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::--version printed '$actual', expected '$expected'"
            exit 1
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The binary with the README, its license, NOTICE and the licenses of the crates built
      # into it.
      - name: Package
        shell: bash
        run: |
          name="parterre-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "$name" dist
          cp README.md LICENSE NOTICE "$name/"
          cargo about generate --locked -c packaging/about.toml packaging/about.hbs \
            -o "$name/THIRD-PARTY-NOTICES.html"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/parterre.exe" "$name/"
            7z a "dist/$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/parterre" "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          fi
      # The installer, from the same files as the zip (packaging/windows/build-msi.ps1).
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 7.0.0
          name="parterre-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          PATH="$USERPROFILE/.dotnet/tools:$PATH" \
            pwsh packaging/windows/build-msi.ps1 -Stage "$name" -Out "dist/$name.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a pre-release part (v0.3.0-rc.1) makes a pre-release.
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "parterre ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            $prerelease

  # The Chocolatey package, from the MSI just published. Pre-releases are built and tested but
  # not pushed.
  chocolatey:
    name: Chocolatey
    needs: publish
    uses: ./.github/workflows/chocolatey.yml
    with:
      tag: ${{ github.ref_name }}
      push: ${{ !contains(github.ref_name, '-') }}
    secrets: inherit
